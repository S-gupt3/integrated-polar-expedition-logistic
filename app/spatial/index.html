<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLOROPSIS Spatial</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #030614;
        font-family: Inter, Segoe UI, Arial, sans-serif;
      }

      #app {
        width: 100%;
        height: 100%;
      }

      .hud {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 10;
        color: #d9fbff;
        pointer-events: none;
        text-shadow: 0 0 12px rgba(51, 246, 255, 0.35);
      }

      .hud h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #33f6ff;
      }

      .hud p {
        margin: 6px 0 0;
        font-size: 12px;
        color: rgba(217, 251, 255, 0.72);
      }

      .hud .tag {
        display: inline-block;
        margin-top: 8px;
        padding: 4px 8px;
        border: 1px solid rgba(51, 246, 255, 0.35);
        border-radius: 4px;
        color: #8ff7ff;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="hud">
      <h1>PLOROPSIS Spatial</h1>
      <p>Maitri Prototype — Neon Digital Twin</p>
      <p>Drag to orbit • Scroll to zoom • Click crates to inspect</p>
      <span class="tag">Core Spatial Engine</span>
    </div>

    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
